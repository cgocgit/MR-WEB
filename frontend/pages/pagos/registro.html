<section class="container">
  <h1>Registrar pago</h1>
  <form id="pagoForm" class="card mt-12" style="display:flex;flex-direction:column;gap:8px;max-width:480px">
    <label>Orden<input name="orden" required></label>
    <label>Fecha<input name="fecha" type="date" required></label>
    <label>Monto<input name="monto" type="number" required></label>
    <label>Método<select name="metodo"><option>Efectivo</option><option>Transferencia</option></select></label>
    <label>Referencia (opcional)<input name="referencia"></label>
    <div style="display:flex;justify-content:flex-end"><button type="submit">Registrar</button></div>
  </form>
  <script type="module">
    import { registrarPago } from './js/api/pagos.service.js';
    const f = document.getElementById('pagoForm');
    f.addEventListener('submit', async (e)=>{ e.preventDefault(); const fd = new FormData(f); const payload = {orden:fd.get('orden'),fecha:fd.get('fecha'),monto:fd.get('monto'),metodo:fd.get('metodo'),referencia:fd.get('referencia')}; await registrarPago(payload); alert('Pago registrado (mock)'); location.hash='#/pagos'; });
  </script>
</section>
