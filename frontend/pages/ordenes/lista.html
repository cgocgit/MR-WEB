<section class="container">
  <h1>Órdenes de servicio</h1>
  <div id="ordenes" class="card mt-12"></div>
  <script type="module">
    import { listOrdenes } from '../../js/api/ordenes.service.js';
    import { renderTable } from '../../js/components/table.js';
    (async ()=>{
      const datos = await listOrdenes();
      renderTable(document.getElementById('ordenes'), ['Id','Cliente','Estatus'], datos.map(d=>({id:d.id,cliente:d.cliente,estatus:d.estatus})));
    })();
  </script>
</section>
