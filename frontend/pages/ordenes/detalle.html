<section class="container">
  <h1>Detalle de orden</h1>
  <div id="detalle" class="card mt-12">Seleccione una orden en la lista</div>
  <script type="module">
    import { getOrden } from '../../js/api/ordenes.service.js';
    const q = new URLSearchParams(location.hash.split('?')[1] || '');
    const id = q.get('id');
    if(id){ (async ()=>{ const d = await getOrden(id); document.getElementById('detalle').textContent = JSON.stringify(d); })() }
  </script>
</section>
