<section class="catalogo-form" id="servicio-formulario-page">
  <div class="catalogo-header">
    <h1 id="form-title">Nuevo Servicio</h1>
  </div>

  <form id="servicio-form" class="catalogo-form" novalidate>
    <!-- Información General -->
    <div class="catalogo-form-section">
      <h2>Información General</h2>
      
      <div class="catalogo-form-row">
        <div class="catalogo-form-group">
          <label for="codigo" class="required">Código</label>
          <input type="text" id="codigo" name="codigo" maxlength="10" required>
          <span class="catalogo-form-error" id="error-codigo"></span>
        </div>
        
        <div class="catalogo-form-group">
          <label for="nombre" class="required">Nombre</label>
          <input type="text" id="nombre" name="nombre" maxlength="150" required>
          <span class="catalogo-form-error" id="error-nombre"></span>
        </div>
      </div>

      <div class="catalogo-form-group">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" maxlength="255"></textarea>
        <span class="catalogo-form-error" id="error-descripcion"></span>
      </div>
    </div>

    <!-- Clasificación -->
    <div class="catalogo-form-section">
      <h2>Clasificación</h2>
      
      <div class="catalogo-form-row">
        <div class="catalogo-form-group">
          <label for="idCategoria" class="required">Categoría</label>
          <select id="idCategoria" name="idCategoria" required>
            <option value="">Seleccione una categoría</option>
          </select>
          <span class="catalogo-form-error" id="error-idCategoria"></span>
        </div>
        
        <div class="catalogo-form-group">
          <label for="tipoServicio" class="required">Tipo de Servicio</label>
          <select id="tipoServicio" name="tipoServicio" required>
            <option value="">Seleccione un tipo</option>
            <option value="Banquete">Banquete</option>
            <option value="Decoración">Decoración</option>
            <option value="Flete">Flete</option>
            <option value="Meseros">Meseros</option>
          </select>
          <span class="catalogo-form-error" id="error-tipoServicio"></span>
        </div>
      </div>
    </div>

    <!-- Tarifa -->
    <div class="catalogo-form-section">
      <h2>Tarifa</h2>
      
      <div class="catalogo-form-row">
        <div class="catalogo-form-group">
          <label for="tarifaBase" class="required">Tarifa Base</label>
          <input type="number" id="tarifaBase" name="tarifaBase" min="0" step="0.01" required>
          <span class="catalogo-form-error" id="error-tarifaBase"></span>
        </div>
      </div>
    </div>

    <!-- Imagen -->
    <div class="catalogo-form-section">
      <h2>Imagen</h2>
      <div class="catalogo-form-image-preview" id="imagen-preview">
        <div class="catalogo-form-image-placeholder">
          🖼️ Previsualización de imagen
        </div>
      </div>
      <p class="catalogo-form-helper">La imagen se mostrará como referencia durante esta iteración.</p>
    </div>

    <!-- Estado -->
    <div class="catalogo-form-section">
      <h2>Estado</h2>
      
      <div class="catalogo-form-group">
        <label for="activo">
          <input type="checkbox" id="activo" name="activo" checked>
          Servicio Activo
        </label>
      </div>
    </div>

    <!-- Botones -->
    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar</button>
      <button type="button" class="btn btn-secondary" id="btn-cancelar" style="flex: 1;">Cancelar</button>
    </div>

    <!-- Mensajes -->
    <div id="form-message" style="display: none;"></div>
  </form>
</section>

<script type="module">
  // El controlador será cargado desde js/modules/catalogo/servicio-formulario.js
  // por el sistema de enrutamiento principal
</script>
