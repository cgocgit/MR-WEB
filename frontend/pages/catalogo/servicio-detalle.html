<section class="catalogo-detail" id="servicio-detalle-page">
  <div class="catalogo-header">
    <h1>Detalle de Servicio</h1>
    <button id="btn-volver" class="btn btn-secondary">← Volver</button>
  </div>

  <!-- Contenido principal -->
  <div id="detalle-content" style="display: none;">
    <!-- Encabezado con imagen e información general -->
    <div class="catalogo-detail-header">
      <div>
        <img id="servicio-imagen" class="catalogo-detail-image" src="" alt="Servicio">
      </div>

      <div class="catalogo-detail-info">
        <h2 class="catalogo-detail-title" id="servicio-nombre"></h2>
        <p class="catalogo-detail-code" id="servicio-codigo"></p>

        <div class="catalogo-detail-meta">
          <div class="catalogo-detail-meta-item">
            <span class="catalogo-detail-meta-label">Categoría</span>
            <span class="catalogo-detail-meta-value" id="servicio-categoria"></span>
          </div>

          <div class="catalogo-detail-meta-item">
            <span class="catalogo-detail-meta-label">Tipo de Servicio</span>
            <span class="catalogo-detail-meta-value" id="servicio-tipo"></span>
          </div>

          <div class="catalogo-detail-meta-item">
            <span class="catalogo-detail-meta-label">Tarifa Base</span>
            <span class="catalogo-detail-meta-value catalogo-price-display" id="servicio-tarifa"></span>
          </div>

          <div class="catalogo-detail-meta-item">
            <span class="catalogo-detail-meta-label">Estado</span>
            <span class="catalogo-detail-meta-value" id="servicio-estado"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Descripción -->
    <div class="catalogo-detail-section">
      <h3>Descripción</h3>
      <p id="servicio-descripcion"></p>
    </div>

    <!-- Paquetes que contienen este servicio -->
    <div class="catalogo-detail-section">
      <h3>Paquetes que Contienen este Servicio</h3>
      <div id="paquetes-lista">
        <p>Cargando paquetes...</p>
      </div>
    </div>

    <!-- Auditoría (solo para gestores) -->
    <div class="catalogo-detail-section" id="seccion-auditoria" style="display: none;">
      <h3>Auditoría</h3>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.875rem;">
        <div>
          <p style="margin: 0 0 0.5rem 0; font-weight: 500; color: var(--color-text-secondary);">Registrado</p>
          <p style="margin: 0;" id="servicio-registro"></p>
        </div>

        <div>
          <p style="margin: 0 0 0.5rem 0; font-weight: 500; color: var(--color-text-secondary);">Última modificación</p>
          <p style="margin: 0;" id="servicio-modificacion"></p>
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <div class="catalogo-detail-actions">
      <button id="btn-editar" class="btn btn-primary" style="display: none;">✎ Editar</button>
      <button id="btn-estado" class="btn btn-secondary" style="display: none;"></button>
    </div>
  </div>

  <!-- Estado: Cargando -->
  <div id="estado-cargando" class="catalogo-loading">
    <div class="catalogo-loading-spinner"></div>
    <span>Cargando servicio...</span>
  </div>

  <!-- Estado: Error -->
  <div id="estado-error" class="catalogo-error" style="display: none;">
    <div class="catalogo-error-icon">⚠️</div>
    <div class="catalogo-error-content">
      <div class="catalogo-error-title">Error al cargar</div>
      <p id="error-mensaje" style="margin: 0; font-size: 0.875rem;"></p>
    </div>
  </div>

  <!-- Estado: Acceso denegado -->
  <div id="estado-acceso" class="catalogo-error" style="display: none;">
    <div class="catalogo-error-icon">🔒</div>
    <div class="catalogo-error-content">
      <div class="catalogo-error-title">Acceso denegado</div>
      <p style="margin: 0; font-size: 0.875rem;">No tiene permisos para ver este contenido.</p>
    </div>
  </div>
</section>

<script type="module">
  // El controlador será cargado desde js/modules/catalogo/servicio-detalle.js
  // por el sistema de enrutamiento principal
</script>
