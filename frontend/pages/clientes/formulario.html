<section
  id="cliente-form-page"
  class="container"
  aria-labelledby="cliente-form-title"
>
  <h1 id="cliente-form-title">
    Prospecto
  </h1>

  <form
    id="cliente-form"
    class="card mt-12"
    style="
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    "
    novalidate
  >
    <label>
      Nombres
      <input
        id="nombres"
        name="nombres"
        type="text"
        autocomplete="given-name"
      >
    </label>

    <label>
      Apellidos
      <input
        id="apellidos"
        name="apellidos"
        type="text"
        autocomplete="family-name"
      >
    </label>

    <fieldset>
      <legend>
        Contactos
      </legend>

      <div
        id="contactos-container"
      ></div>

      <button
        id="agregar-contacto"
        type="button"
      >
        Agregar contacto
      </button>
    </fieldset>

    <label>
      Evento
      <input
        id="evento"
        name="evento"
        type="text"
      >
    </label>

    <div
      style="
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      "
    >
      <button
        id="cancelar"
        type="button"
      >
        Cancelar
      </button>

      <button
        id="guardar"
        type="submit"
      >
        Guardar
      </button>
    </div>
  </form>

  <script type="module">
    import {
      init
    } from '../../js/modules/clientes/formulario.js';

    init();
  </script>
</section>
