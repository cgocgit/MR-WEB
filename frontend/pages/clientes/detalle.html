<section class="container">
  <h1>Detalle de cliente</h1>
  <div id="detalle" class="card mt-12">Cargando...</div>

  <script type="module">
    import { getCliente } from '../../js/api/clientes.service.js';
    const q = new URLSearchParams(location.hash.split('?')[1] || '');
    const id = q.get('id');
    (async ()=>{
      if(!id){ document.getElementById('detalle').textContent = 'No se indicó cliente.'; return }
      const data = await getCliente(id);
      document.getElementById('detalle').innerHTML = `<p><strong>Nombre:</strong> ${data.nombre}</p><p><strong>Contacto:</strong> ${data.contacto}</p>`;
    })();
  </script>
</section>
