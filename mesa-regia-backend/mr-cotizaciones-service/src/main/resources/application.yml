spring:
  application:
    name: mr-cotizaciones-service
  profiles:
    default: local
  jpa:
    open-in-view: false
server:
  port: ${SERVER_PORT:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
mesa-regia:
  cotizaciones:
    expiration-cron: ${MR_COTIZACIONES_EXPIRATION_CRON:0 */5 * * * *}
